# Kaada API on the shared host. Postgres and Redis are NOT defined here: they live in the shared infra stack on the external
# `alpha` network and are reached by hostname (postgres, redis).
#
# Images are pinned by IMAGE_OWNER / REPO_NAME / IMAGE_TAG, supplied by the environment (deploy.sh exports them; the systemd
# unit loads them from image.env). Application settings come from .env next to this file; they are never part of the image.
name: kaada

services:
  kaada-api:
    image: ghcr.io/${IMAGE_OWNER}/${REPO_NAME}-api:${IMAGE_TAG}
    container_name: kaada-api
    restart: unless-stopped
    # A real PID 1 that forwards SIGTERM and reaps children, so a stop is a clean shutdown (Nest shutdown hooks run).
    init: true
    # Caddy on the host proxies api.kaada.xyz to this loopback port; it is never published on a public interface.
    ports:
      - "127.0.0.1:3005:3005"
    env_file: .env
    # Secrets are mounted ONE FILE AT A TIME, read-only, outside the image. Never the whole secrets directory (unrelated host files
    # must not be visible in the container), never an environment variable. Host files: owner 1000:1000, mode 400, in a 500 directory.
    # Each must exist on the host before `up`: Docker would otherwise create a DIRECTORY at the missing source path.
    volumes:
      # The recovery relayer key (0x + 64 hex).
      - /opt/apps/kaada/secrets/recovery-relayer.key:/run/secrets/recovery-relayer.key:ro
      # Kaada's platform / agent wallet key (0x + 64 hex). Not a user wallet.
      - /opt/apps/kaada/secrets/platform-agent.key:/run/secrets/platform-agent.key:ro
      # The recovery SMTP password (RECOVERY_SMTP_PASSWORD_FILE): the whole file is the password, minus its trailing newline.
      - /opt/apps/kaada/secrets/recovery-smtp-password:/run/secrets/recovery-smtp-password:ro
    # These two must agree with the port mapping above, whatever .env says.
    environment:
      PORT: "3005"
      API_HOST: "0.0.0.0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - alpha

networks:
  alpha:
    external: true
    name: alpha
